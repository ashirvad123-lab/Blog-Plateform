{% extends "base.html" %}

{% block title %}Access Denied (403) - BlogSphere{% endblock %}

{% block content %}
<div class="py-5 my-auto text-center">
  <div class="container">
    <div class="py-5" style="max-width: 580px; margin: 0 auto;">
      <div class="display-1 fw-extrabold text-warning mb-2" style="font-size: 6rem; letter-spacing: -3px;">
        403
      </div>
      <h2 class="h3 fw-bold text-dark mb-3">Access Denied</h2>
      <p class="text-muted mb-4" style="line-height: 1.7;">
        You don't have permission to access or modify this resource. Only authorized users or administrators can view this area.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-pill px-4">
          <i class="bi bi-house-door me-1"></i> Back to Homepage
        </a>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-pill px-4">
          <i class="bi bi-speedometer2 me-1"></i> My Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
